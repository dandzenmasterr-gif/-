name: Publish to gh-pages

on:
  push:
    branches: [claude/realestate-content-platform-xtz5o4]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push current content to gh-pages
        run: git push --force origin HEAD:gh-pages
